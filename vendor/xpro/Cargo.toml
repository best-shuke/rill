[workspace]
resolver = "2"
exclude = ["fuzz"]
members = ["crates/xpro-protocol", "crates/xpro-transport", "crates/xpro-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
xpro-protocol = { path = "crates/xpro-protocol", version = "=0.1.0" }
xpro-transport = { path = "crates/xpro-transport", version = "=0.1.0" }
xpro-client = { path = "crates/xpro-client", version = "=0.1.0" }
boring = "=5.2.0"
tokio-boring = "=5.2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
http = "1"
h2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
async-trait = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
