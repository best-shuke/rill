[package]
name = "xpro-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
xpro-protocol = { path = "../xpro-protocol", version = "=0.1.0" }
xpro-transport = { path = "../xpro-transport", version = "=0.1.0" }
boring = "=5.2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
http = "1"
h2 = "0.4"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
async-trait = "0.1"
