[package]
name = "rill-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DNS resolver, cache, snooping (IP to domain), and FakeIP for the rill proxy kernel."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["encrypted", "doh-h2", "dns-server"]
# DoT / DoH upstreams. TLS goes through `rill_transport::tls::TlsLayer`, so
# DNS shares the process-wide backend (BoringSSL when the app is built with
# `boring-tls` — the default — rustls otherwise) instead of carrying its own
# rustls client config.
encrypted = ["dep:rill-transport"]
# DoH over one kept HTTP/2 connection per upstream (`doh`). Without it each
# DoH query opens its own HTTP/1.1 connection. The `minimal` bundle leaves it
# out: it is the first user of h2's client there, ~0.5 MB at opt-level "z"
# (ADR-0007 caps).
doh-h2 = ["encrypted", "dep:h2", "dep:http", "dep:bytes", "rill-transport/h2"]
# `dns-server` historically gated hickory-server; the in-tree server now uses
# only `hickory-proto`, so the feature is a no-op kept for API stability.
dns-server = []

[dependencies]
rill-common = { workspace = true }
rill-trie = { workspace = true }
tokio = { workspace = true }
hickory-proto = { workspace = true }
rill-transport = { workspace = true, features = ["tls"], optional = true }
h2 = { version = "0.4", optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rand = { workspace = true }
lru = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
ipnet = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
# Used by `host_resolver_hook` on Android. The module is
# `#[cfg(target_os = "android")]` so this dep is dead weight on
# iOS/desktop, but moving it under `target.'cfg(target_os = "android")'`
# would hide it from `cargo check` on a host build and re-create the
# class of "compiles on macOS host, fails on the Android target" bug
# we just fixed. Cost is negligible (one proc-macro crate, build-time only).
async-trait = { workspace = true }

[dev-dependencies]
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = "0.13"
tokio = { workspace = true, features = ["test-util"] }
sysinfo = "0.32"
hickory-proto = { workspace = true }

[lints]
workspace = true
