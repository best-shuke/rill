[package]
name = "rill-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line control for a running rill proxy kernel over its REST API."
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The `rill-cli` name on crates.io belongs to an unrelated crate: the binary
# ships in the release archives instead.
publish = false

[[bin]]
name = "rill-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Only for `controller_file`, which rill writes and rill-cli reads.
rill-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# rill_cli_test serves the real rill-api router to the built binary.
axum = { workspace = true }
dashmap = { workspace = true }
rill-api = { workspace = true }
rill-config = { workspace = true, default-features = false }
rill-dns = { workspace = true, default-features = false }
rill-trie = { workspace = true }
rill-tunnel = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
