[package]
name = "rill-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core routing engine (TCP/UDP relay, rule dispatch, connection statistics) for the rill proxy kernel."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rill-common = { workspace = true }
rill-dns = { workspace = true, default-features = false }
rill-rules = { workspace = true }
rill-proxy = { workspace = true, default-features = false }
rill-trie = { workspace = true }
ipnet = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }
smallvec = { workspace = true }
time = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "udp_bench"
harness = false

[[bench]]
name = "rules_bench"
harness = false

[[bench]]
name = "stats_bench"
harness = false

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
rill-trie = { workspace = true }
criterion = { workspace = true }
dashmap = { workspace = true }
ipnet = { workspace = true }
rill-config = { workspace = true }
rill-rules = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
